name: CI Ctest

# Pull requests run on their own trigger; a push run of a PR branch would repeat it.
on:
  push:
    branches: [main]
  pull_request:

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "2"

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_type: Debug
          - os: macos-latest
            build_type: Release

    steps:
      - name: Checkout Yggdrasil
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # pyurd (urd, and with it pyurd-native, the native dependencies) comes from the index, with the rest of pyproject.toml's requirements.
      - name: Install python requirements
        run: |
          python -m pip install --no-cache-dir --upgrade pip uv
          uv pip install --system --no-cache -r pyproject.toml --extra test
          uv pip install --system --no-cache "nanobind-backend>=1.0" "pybrokkr>=0.1.1,<0.2"

      - name: Install CMake on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake

      # Every compiler warning fails the build here, so none goes unnoticed.
      - name: Configure and Build Yggdrasil
        run: |
          cmake -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
                -DYGGDRASIL_BUILD_TESTS=ON \
                -DYGGDRASIL_BUILD_PROFILING=ON \
                -DCMAKE_INSTALL_LIBDIR=lib \
                -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')" \
                -DPython3_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')" \
                -S . -B build_${{ matrix.build_type }}
          cmake --build build_${{ matrix.build_type }} --parallel 2

      - name: Run Tests
        run: |
          NATIVE_LIB_DIR="$(python -c 'import pyurd_native; print(pyurd_native.native_prefix() / "lib")')"
          export DYLD_LIBRARY_PATH="${NATIVE_LIB_DIR}:${DYLD_LIBRARY_PATH:-}"
          export LD_LIBRARY_PATH="${NATIVE_LIB_DIR}:${LD_LIBRARY_PATH:-}"
          GTEST_OUTPUT=xml:test-results/ GTEST_COLOR=1 ctest --test-dir build_${{ matrix.build_type }} -V
