name: CI Pytest

# Pull requests run on their own trigger; a push run of a PR branch would repeat it.
on:
  push:
    branches: [main]
  pull_request:

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  YGGDRASIL_JOBS: "2"

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CMake on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake

      - name: Install dependencies and requirements
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir setuptools pytest
        env:
          PIP_NO_CACHE_DIR: 1

      # pyurd (urd, and with it pyurd-native, the native dependencies) comes from the index, as a build requirement.
      - name: Install build requirements
        run: python -m pip install --no-cache-dir "nanobind-backend>=1.0" "pybrokkr>=0.1.2,<0.2" "pyurd>=0.1.0,<0.2"

      - name: Build and install
        run: python -m pip install --no-cache-dir --verbose .[test]
        env:
          PIP_NO_CACHE_DIR: 1

      - name: Test
        run: python -m pytest python/tests
