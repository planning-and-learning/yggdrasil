name: CI Release

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

jobs:
  build_sdist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build source distribution
        run: python -m build --sdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v5
        with:
          name: sdist
          path: dist/*.tar.gz

  build_corresponding_source:
    needs: build_sdist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Download source distribution
        uses: actions/download-artifact@v5
        with:
          name: sdist
          path: dist

      - name: Download upstream sources
        run: |
          cmake -S src -B source-build \
                -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/yggdrasil-source-prefix" \
                -DCMAKE_INSTALL_LIBDIR=lib \
                -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"
          cmake --build source-build --target corresponding-source-downloads --parallel

      - name: Build corresponding-source bundle
        run: |
          SDISTS=(dist/*.tar.gz)
          test "${#SDISTS[@]}" -eq 1
          test -f "${SDISTS[0]}"
          SOURCE_ARCHIVE=${SDISTS[0]#dist/}
          SOURCE_ARCHIVE=${SOURCE_ARCHIVE%.tar.gz}-corresponding-source.tar.gz
          mkdir -p release-assets
          python cmake/build_corresponding_source.py \
            --manifest docs/SOURCES.json \
            --sdist "${SDISTS[0]}" \
            --sources source-build \
            --output "release-assets/${SOURCE_ARCHIVE}"

      - name: Upload corresponding-source artifact
        uses: actions/upload-artifact@v5
        with:
          name: corresponding-source
          path: release-assets/*.tar.gz

  build_wheels_linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: ["x86_64"]
        python-version: ["cp311"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel

      - name: Build Linux wheels
        run: cibuildwheel --output-dir wheelhouse
        env:
          CIBW_PLATFORM: linux
          CIBW_BUILD: "${{ matrix.python-version }}-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS: "${{ matrix.architecture }}"
          CIBW_BUILD_VERBOSITY: "1"

      - name: Upload Linux wheels artifact
        uses: actions/upload-artifact@v5
        with:
          name: wheels-linux-${{ matrix.python-version }}-${{ matrix.architecture }}
          path: wheelhouse/*.whl

  build_wheels_macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["cp311"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel

      - name: Build macOS wheels
        run: cibuildwheel --output-dir wheelhouse
        env:
          CIBW_PLATFORM: macos
          CIBW_BUILD: "${{ matrix.python-version }}-*"
          CIBW_ARCHS: arm64
          CIBW_BUILD_VERBOSITY: "1"

      - name: Upload macOS wheels artifact
        uses: actions/upload-artifact@v5
        with:
          name: wheels-macos-${{ matrix.python-version }}-arm64
          path: wheelhouse/*.whl

  validate_release:
    needs:
      - build_sdist
      - build_corresponding_source
      - build_wheels_linux
      - build_wheels_macos
    runs-on: ubuntu-latest

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v5
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download source distribution
        uses: actions/download-artifact@v5
        with:
          name: sdist
          path: dist

      - name: Download corresponding-source bundle
        uses: actions/download-artifact@v5
        with:
          name: corresponding-source
          path: release-assets

      - name: Validate release assets
        run: |
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 2
          test "$(find release-assets -maxdepth 1 -type f -name '*-corresponding-source.tar.gz' | wc -l)" -eq 1
          tar -tzf release-assets/*-corresponding-source.tar.gz >/dev/null
