name: peachycheck

on:
  pull_request:
  push:
    branches: [main]

jobs:
  peachycheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: "3.11"
      - uses: drexlerd/peachycheck@v0.1.0
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        with:
          # clang-tidy needs compile_commands.json, pyright the package in
          # .venv (its stubs are generated at install), and both pyurd's
          # native dependencies (from the index).
          prepare: |
            "$PYTHON" -m pip install "nanobind-backend>=1.0" "pybrokkr>=0.2.1,<0.3" "pyurd>=0.3.0,<0.4"
            cmake -S . -B build/peachycheck -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
                  -DYGGDRASIL_BUILD_TESTS=ON -DYGGDRASIL_BUILD_BENCHMARKS=ON \
                  -DCMAKE_INSTALL_LIBDIR=lib \
                  -DPython_EXECUTABLE="$PYTHON"
            "$PYTHON" -m venv .venv
            .venv/bin/python -m pip install --no-cache-dir ".[test]"
      # The schema rules (brokkr's docs/schema_rules.rst, S1 to S4), parsed with clang over the compile database the
      # lint configured.
      - name: Schema rules
        run: |
          python3 -m venv "$RUNNER_TEMP/rules"
          "$RUNNER_TEMP/rules/bin/python" -m pip install --quiet "pybrokkr[fallbacks]>=0.2.1,<0.3"
          which -a clang++ clang++-18 clang || true; clang++ --version | head -1; clang++ -print-resource-dir
          echo "CPATH=$CPATH CPLUS_INCLUDE_PATH=$CPLUS_INCLUDE_PATH"
          "$RUNNER_TEMP/rules/bin/python" -m pip show libclang pybrokkr | grep -E "Name|Version"
          "$RUNNER_TEMP/rules/bin/python" - <<'PY'
          from pathlib import Path
          import clang.cindex as ci, glob, subprocess
          lib = Path(subprocess.run(["clang++", "-print-resource-dir"], capture_output=True, text=True).stdout.strip()).parents[1]
          print("LIBS", sorted(glob.glob(str(lib / "libclang*.so*"))))
          ci.Config.set_library_path(str(lib))
          from pybrokkr.rules.schema.records import database
          db = database(Path("."), Path("build/peachycheck/compile_commands.json"))
          f = Path("python/src/pyyggdrasil/execution/module.cpp").resolve()
          flags = db.binding
          print("resource", db.resource)
          print("flags", flags)
          tu = ci.Index.create().parse(str(f), args=[*flags, "-resource-dir", db.resource, "-x", "c++"])
          for d in tu.diagnostics:
              if d.severity >= 3:
                  print("DIAG", d.location.file, d.location.line, d.spelling)
          for inc in tu.get_includes():
              if "intrin" in str(inc.include) or "tbb" in str(inc.include):
                  print("INC", inc.include)
          PY
          "$RUNNER_TEMP/rules/bin/python" -m pybrokkr.rules S --compile-commands build/peachycheck/compile_commands.json -j 4
