name: peachycheck

on:
  pull_request:
  push:
    branches: [main]

jobs:
  peachycheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: "3.11"
      - uses: drexlerd/peachycheck@v0.1.0
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        with:
          # clang-tidy needs compile_commands.json, pyright the package in
          # .venv (its stubs are generated at install), and both pyurd's
          # native dependencies (from the index).
          prepare: |
            "$PYTHON" -m pip install "nanobind-backend>=1.0" "pybrokkr>=0.1.2,<0.2" "pyurd>=0.1.1,<0.2"
            cmake -S . -B build/peachycheck -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
                  -DYGGDRASIL_BUILD_TESTS=ON -DYGGDRASIL_BUILD_PROFILING=ON -DYGGDRASIL_UNITY_BUILD=OFF \
                  -DCMAKE_INSTALL_LIBDIR=lib \
                  -DPython_EXECUTABLE="$PYTHON"
            "$PYTHON" -m venv .venv
            .venv/bin/python -m pip install --no-cache-dir ".[test]"
