name: plumbcheck

on:
  pull_request:
  push:
    branches: [main]

jobs:
  plumbcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: "3.11"
      # The native dependencies take minutes to build; they are rebuilt only
      # when their recipe changes. They live outside the repository: the
      # plumbcheck action checks it out again, which would delete them there.
      # Restore and save are separate steps, so the cache is saved right after
      # the build, even when the lint then fails the job.
      - uses: actions/cache/restore@v4
        id: deps
        with:
          path: ~/yggdrasil-deps
          key: deps-${{ runner.os }}-${{ hashFiles('src/**', '!src/database/**', 'cmake/**', 'docs/SOURCES.json') }}
      - name: Build native dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          "$PYTHON" -m pip install "nanobind-backend>=1.0"
          cmake -S src -B "$RUNNER_TEMP/deps-build" -DCMAKE_BUILD_TYPE=Release \
                -DYGGDRASIL_JOBS=4 -DCMAKE_INSTALL_PREFIX="$HOME/yggdrasil-deps" -DCMAKE_INSTALL_LIBDIR=lib \
                -DPython_EXECUTABLE="$PYTHON"
          cmake --build "$RUNNER_TEMP/deps-build" --parallel 4
          cmake --install "$RUNNER_TEMP/deps-build"
      - uses: actions/cache/save@v4
        if: steps.deps.outputs.cache-hit != 'true'
        with:
          path: ~/yggdrasil-deps
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - uses: drexlerd/plumbcheck@9815e1d9ee833afba91a7a177d15ecb12a2d3aca
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        with:
          # clang-tidy needs compile_commands.json, pyright the package in
          # .venv (its stubs are generated at install), and both the native
          # dependencies.
          prepare: |
            DEPS="$HOME/yggdrasil-deps"
            "$PYTHON" -m pip install "nanobind-backend>=1.0"
            cmake -S . -B build/plumbcheck -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
                  -DYGGDRASIL_BUILD_TESTS=ON -DYGGDRASIL_BUILD_PROFILING=ON -DYGGDRASIL_UNITY_BUILD=OFF \
                  -DYGGDRASIL_NATIVE_PREFIX="$DEPS" -DCMAKE_INSTALL_LIBDIR=lib \
                  -DPython_EXECUTABLE="$PYTHON"
            "$PYTHON" -m venv .venv
            YGGDRASIL_BUILD_NATIVE=OFF YGGDRASIL_NATIVE_PREFIX="$DEPS" \
              .venv/bin/python -m pip install --no-cache-dir ".[test]"
