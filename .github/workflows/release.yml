name: Release

on:
  push:
    tags:
      - "v*"

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  YGGDRASIL_JOBS: "2"

jobs:
  build_sdist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build frontend
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir build

      - name: Build source distribution
        run: python -m build --sdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v5
        with:
          name: sdist
          path: dist/*.tar.gz

  build_wheels_linux:
    runs-on: ${{ matrix.architecture == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        architecture: ["x86_64", "aarch64"]
        python-version: ["cp311"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install cibuildwheel
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir cibuildwheel

      - name: Build Linux wheels
        run: cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ENVIRONMENT: "YGGDRASIL_JOBS=2 CMAKE_BUILD_PARALLEL_LEVEL=2"
          CIBW_PLATFORM: linux
          CIBW_BUILD: "${{ matrix.python-version }}-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS: "${{ matrix.architecture }}"
          CIBW_BUILD_VERBOSITY: "1"

      - name: Upload Linux wheels artifact
        uses: actions/upload-artifact@v5
        with:
          name: wheels-linux-${{ matrix.python-version }}-${{ matrix.architecture }}
          path: wheelhouse/*.whl

  build_wheels_macos:
    runs-on: ${{ matrix.architecture == 'x86_64' && 'macos-15-intel' || 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        architecture: ["arm64", "x86_64"]
        python-version: ["cp311"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install cibuildwheel
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir cibuildwheel

      - name: Build macOS wheels
        run: cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ENVIRONMENT: "YGGDRASIL_JOBS=2 CMAKE_BUILD_PARALLEL_LEVEL=2"
          CIBW_PLATFORM: macos
          CIBW_BUILD: "${{ matrix.python-version }}-*"
          CIBW_ARCHS: "${{ matrix.architecture }}"
          CIBW_BUILD_VERBOSITY: "1"

      - name: Upload macOS wheels artifact
        uses: actions/upload-artifact@v5
        with:
          name: wheels-macos-${{ matrix.python-version }}-${{ matrix.architecture }}
          path: wheelhouse/*.whl

  github_release:
    needs:
      - build_sdist
      - build_wheels_linux
      - build_wheels_macos
    runs-on: ubuntu-latest

    if: github.repository_owner == 'planning-and-learning'

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check version matches tag
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          TAG=${GITHUB_REF#refs/tags/v}

          echo "Package version: $VERSION"
          echo "Git tag: $TAG"

          if [ "$VERSION" != "$TAG" ]; then
            echo "Version mismatch: pyproject.toml=$VERSION tag=$TAG"
            exit 1
          fi

      - name: Download wheels
        uses: actions/download-artifact@v5
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download source distribution
        uses: actions/download-artifact@v5
        with:
          name: sdist
          path: dist

      - name: Inspect release assets
        run: find dist -maxdepth 1 -type f

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes

  publish:
    needs: github_release
    runs-on: ubuntu-latest

    if: github.repository_owner == 'planning-and-learning'

    permissions:
      id-token: write

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v5
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download source distribution
        uses: actions/download-artifact@v5
        with:
          name: sdist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
