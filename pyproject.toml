[build-system]
requires = [
    "scikit-build-core>=1.0.3,<2",
    "nanobind-backend>=1.0",
    "pybrokkr>=0.1.2,<0.2",
    "pyurd>=0.1.0,<0.2",
]
build-backend = "pyyggdrasil_build_backend"
backend-path = ["python"]

[project]
name = "pyyggdrasil"
version = "0.7.0"
description = "yggdrasil: data structures and a database engine for Dominik Drexler's planning projects"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "Dominik Drexler", email = "dominik.drexler@liu.se"},
]
dependencies = [
    "nanobind-backend>=1.0",
    "pyurd>=0.1.0,<0.2",
]

[project.optional-dependencies]
test = [
    "pytest",
    # The build backend wraps pybrokkr; installed here so type checkers
    # resolve it (it is otherwise only a build-system requirement).
    "pybrokkr>=0.1.2,<0.2",
]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[project.urls]
Homepage = "https://github.com/planning-and-learning/yggdrasil"

[tool.scikit-build]
build.targets = ["pyyggdrasil_wheel"]
cmake.build-type = "Release"
install.components = ["pyyggdrasil"]
wheel.packages = []
wheel.py-api = "cp311"

[tool.scikit-build.sdist]
include = [
    "CMakeLists.txt",
    "Config.cmake.in",
    "docs/**",
    "LICENSE",
    "README.md",
    "pyproject.toml",
    "python/**",
    "src/**",
    "include/**",
    "cmake/**",
]
exclude = [
    "build*/**",
    "dependencies-build/**",
    "dependencies-install/**",
    "*.egg-info/**",
]

[tool.scikit-build.cmake.define]
YGGDRASIL_USE_LLD = false
YGGDRASIL_ENABLE_LTO = {env = "YGGDRASIL_ENABLE_LTO", default = false}
CMAKE_INSTALL_LIBDIR = "lib"

[tool.cibuildwheel]
build = "cp311-*"
container-engine = "docker"
test-requires = ["cmake>=3.21"]
test-command = "python {project}/python/tests/test_import.py"
# pyurd in the build environment: the repair command below is its (pyurd.repair). The index may still be publishing a
# new pyurd, so the install is retried.
before-build = "n=0; until python -m pip install --no-cache-dir 'pyurd>=0.1.0,<0.2'; do n=$((n+1)); [ $n -ge 30 ] && exit 1; echo 'pyurd not on the index yet; retrying in 60s'; sleep 60; done"

[tool.cibuildwheel.linux]
repair-wheel-command = "python -m pyurd.repair --providers pyurd_native --dest-dir {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
repair-wheel-command = "python -m pyurd.repair --providers pyurd_native --require-archs {delocate_archs} --dest-dir {dest_dir} {wheel}"
