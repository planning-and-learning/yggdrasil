[build-system]
requires = [
    "scikit-build-core>=1.0.3,<2",
    "nanobind-backend>=1.0",
]
build-backend = "pyyggdrasil_build_backend"
backend-path = ["python"]

[project]
name = "pyyggdrasil"
version = "0.1.2"
description = "Native dependency provider for Dominik Drexler's planning projects"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "Dominik Drexler", email = "dominik.drexler@liu.se"},
]
dependencies = [
    "nanobind-backend>=1.0",
    "tabulate>=0.9",
]

[project.optional-dependencies]
test = [
    "pytest",
    "types-tabulate",
    # build_support.py wraps scikit-build-core; installed here so type checkers
    # resolve it (it is otherwise only a build-system requirement).
    "scikit-build-core>=1.0.3,<2",
]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[project.urls]
Homepage = "https://github.com/planning-and-learning/yggdrasil"

[tool.scikit-build]
build.targets = ["pyyggdrasil_wheel"]
cmake.build-type = "Release"
install.components = ["pyyggdrasil"]
wheel.packages = []
wheel.py-api = "cp311"

[tool.scikit-build.sdist]
include = [
    "CMakeLists.txt",
    "Config.cmake.in",
    "docs/**",
    "LICENSE",
    "README.md",
    "pyproject.toml",
    "python/**",
    "src/**",
    "include/**",
    "cmake/**",
]
exclude = [
    "build*/**",
    "dependencies-build/**",
    "dependencies-install/**",
    "*.egg-info/**",
]

[tool.scikit-build.cmake.define]
YGGDRASIL_NATIVE_PREFIX = {env = "YGGDRASIL_NATIVE_PREFIX", default = "dependencies-install"}
YGGDRASIL_USE_LLD = false
YGGDRASIL_ENABLE_LTO = {env = "YGGDRASIL_ENABLE_LTO", default = false}
CMAKE_INSTALL_LIBDIR = "lib"

[tool.cibuildwheel]
build = "cp311-*"
container-engine = "docker"
test-requires = ["cmake>=3.21"]
test-command = "python {project}/python/tests/test_mpi.py"

[tool.cibuildwheel.linux]
repair-wheel-command = "LD_LIBRARY_PATH=$(python -c 'import os, pathlib; prefix = pathlib.Path(\"dependencies-install\"); print(os.pathsep.join(str(path) for path in sorted(prefix.glob(\"lib*\")) if path.is_dir()))') auditwheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"
