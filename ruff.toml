# ruff for peachycheck: every rule is on, except where a rule is wrong for any code
# here, not just for today's; each exception says why.
line-length = 120
src = ["python/src"]

[lint]
select = ["ALL"]
ignore = [
    # Trailing commas are the formatter's; ruff's docs list COM812 as conflicting with it.
    "COM812",
    # Messages say what failed where it is raised; a class per message would only move the text.
    "TRY003",
    # Fires on every subprocess call, though they pass fixed argument lists and no shell.
    "S603",
    # Imports used only in annotations stay ordinary imports: no `if TYPE_CHECKING:`
    # blocks (banned below), so every name a module annotates is also there at runtime.
    "TC001", "TC002", "TC003",
]

# Google Python Style Guide docstrings; this also settles ruff's conflicting
# docstring rules (D203/D211, D212/D213).
[lint.pydocstyle]
convention = "google"

# Absolute imports only.
[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[lint.flake8-tidy-imports.banned-api]
"typing.TYPE_CHECKING".msg = "Import at module level instead; modules here have no import cycles to break."

# Re-exports (`Name as Name`) of one module stay one import statement.
[lint.isort]
combine-as-imports = true

[lint.per-file-ignores]
# Tests: pytest asserts with `assert`, literal values are the test data, test names
# document the behavior, pytest passes parametrized values by name, every assertion
# counts as a branch, the test folders are not packages, and random test data comes from
# seeded generators.
"{python/tests,tests/python}/**" = ["S101", "PLR2004", "D1", "FBT001", "C901", "PLR0912", "PLR0915", "INP001", "S311"]

# Scripts that CTest runs without pytest: pytest's style rules do not apply, and their
# imports follow putting the freshly built package on sys.path.
"tests/python/**" = ["PT", "PLC0415"]
# Command-line entry points print their output.
"python/src/pyyggdrasil/{__main__,repair}.py" = ["T201"]
# Re-exports the library's compile() under its C++ name (ygg::database::compile).
"python/src/pyyggdrasil/database/__init__.py" = ["A004"]
# Standalone scripts, run by CMake and the build frontend, not packages.
"{cmake/build_corresponding_source.py,python/pyyggdrasil_build_backend.py}" = ["INP001"]
